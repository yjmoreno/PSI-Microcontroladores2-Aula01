CONFIG_GPIO=y
CONFIG_SERIAL=y

# Acelerometro MMA8451Q no I2C0 (driver fxos8700 do Zephyr, modo so acelerometro)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_FXOS8700=y
CONFIG_FXOS8700_MODE_ACCEL=y

# printk com %f (para mandar os numeros em ponto flutuante pela serial)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Nome das threads (ajuda no debug)
CONFIG_THREAD_NAME=y
